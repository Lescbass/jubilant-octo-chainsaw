name: Robo de Precos

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python buscar_precos.py
      - uses: actions/upload-artifact@v4
        with:
          name: resultado-precos
          path: resultado_precos.csv
